<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#14181C" />
  <title>Casa Maranta – Gästemappe</title>
  <link rel="stylesheet" href="style.css?v=18" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&display=swap" rel="stylesheet" />
</head>
<body>
<!--
  THESIS: The guide is the yellow signpost at the trailhead — every destination
  named on its own enamel plate. It refuses the icon-tile grid every guest guide ships.
  OWN-WORLD: Swiss Wanderweg signage. Wet-slate ground (#14181C), signal-yellow
  enamel plates (#FFCC00), enamel white (#F4F2EC), route-blaze red (#E30613) for
  emergency only. Archivo, width axis. Bolt holes, routed edges, pointed plates.
  Four values, no fifth, no gradients.
  STORY: A guest in a lamplit stone house finds the one answer they need, and the
  house feels like the valley they walked through today.
  FIRST VIEWPORT: The journey itself — a Streckenplan-style schematic of the
  Rhaetian line from Zürich HB over Ospizio Bernina down into Poschiavo, drawn
  live: the route paints in signal yellow, stations ignite as the train passes,
  altitude carries the drama, and the ride resolves into a dashed 15-minute
  walking trail ending at the steel post with the LOSLEGEN plate.
  FORM: Wanderweg — candidate 4 of 7. Seed key 361bf423.
  FINISH: unreviewed and undocumented is unfinished; this build ends with the finish
  review, the verdict, DESIGN.md, and every shipping raster carrying its provenance.
-->

<!-- LOGIN -->
<div id="login-overlay">
  <div id="login-card">
    <div class="post-head">
      <h1 class="routed">Casa Maranta</h1>
      <p class="post-sub">Via da la Rasiga 12 · Li Curt</p>
    </div>
    <input type="password" id="login-input" placeholder="Passwort / Password" autocomplete="current-password" />
    <p id="login-error" role="alert"></p>
    <button id="login-btn" class="plate plate--action" onclick="checkLogin()">
      <span class="plate-bolt"></span>
      <span class="plate-name">Weiter / Continue</span>
    </button>
  </div>
</div>

<div id="app-shell">

<!-- ══════════ START ══════════ -->
<div id="screen-home" class="screen active">
  <div class="home-hero">
    <div class="lang-toggle" role="group" aria-label="Sprache / Language">
      <button id="lang-de" class="lang-btn active" onclick="setLang('de')">DE</button>
      <button id="lang-en" class="lang-btn" onclick="setLang('en')">EN</button>
    </div>

    <div class="journey" id="journey" aria-hidden="true"></div>

    <div class="post">
      <div class="post-mast" aria-hidden="true"></div>

      <div class="post-head">
        <h1 class="routed">
          <svg class="home-mark" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 10.5 12 4l8 6.5V20a1 1 0 01-1 1h-4v-6h-6v6H5a1 1 0 01-1-1z"/></svg>
          Casa Maranta
        </h1>
        <p class="post-sub">
          <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 10c0 6-8 12-8 12S4 16 4 10a8 8 0 0116 0z"/><circle cx="12" cy="10" r="2.6"/></svg>
          Via da la Rasiga 12, Li Curt, 7745 CH
        </p>
      </div>

      <div class="post-body">
        <button class="plate plate--action" onclick="showScreen('screen-info'); setNavActive('nav-info')">
          <span class="plate-bolt"></span>
          <span class="plate-name" data-de="Loslegen" data-en="Get Started">Loslegen</span>
          <svg class="plate-arrow" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h13M13 6l6 6-6 6"/></svg>
        </button>

        <div class="post-foot">
          <div class="foot-item">
            <span class="foot-label" data-de="Check-in ab" data-en="Check-in after">Check-in ab</span>
            <span class="foot-time">16:00</span>
          </div>
          <div class="foot-rule" aria-hidden="true"></div>
          <div class="foot-item">
            <span class="foot-label" data-de="Check-out bis" data-en="Check-out before">Check-out bis</span>
            <span class="foot-time">10:00</span>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- ══════════ WEGWEISER (info) ══════════ -->
<div id="screen-info" class="screen">
  <div class="top-bar">
    <button class="icon-btn" onclick="showScreen('screen-home'); setNavActive('nav-home')" aria-label="Start">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 10.5 12 4l8 6.5V20a1 1 0 01-1 1h-4v-6h-6v6H5a1 1 0 01-1-1z"/></svg>
    </button>
    <span class="top-bar-title" data-de="Wegweiser" data-en="Signpost">Wegweiser</span>
    <span class="top-bar-spacer"></span>
  </div>

  <div class="signpost">
    <div class="signpost-mast" aria-hidden="true"></div>

    <button class="plate" onclick="showDetail('welcome')" style="--i:0">
      <span class="plate-bolt"></span>
      <svg class="plate-ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 13V6.2a2 2 0 114 0V5a2 2 0 114 0v3"/><path d="M16 8.6a2 2 0 114 0V15a6 6 0 01-6 6h-1.5a6 6 0 01-6-6v-2.2a1.9 1.9 0 113.8 0"/></svg>
      <span class="plate-name" data-de="Willkommen" data-en="Welcome">Willkommen</span>
    </button>

    <button class="plate" onclick="showDetail('arrival')" style="--i:1">
      <span class="plate-bolt"></span>
      <svg class="plate-ico" viewBox="0 0 24 24" aria-hidden="true"><circle cx="8" cy="15" r="4"/><path d="M10.9 12.1 20 3M16 4h4v4"/></svg>
      <span class="plate-name" data-de="Anreise-Info" data-en="Arrival Information">Anreise-Info</span>
    </button>

    <button class="plate" onclick="showDetail('accommodation')" style="--i:2">
      <span class="plate-bolt"></span>
      <svg class="plate-ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 10.5 12 4l8 6.5V20a1 1 0 01-1 1h-4v-6h-6v6H5a1 1 0 01-1-1z"/></svg>
      <span class="plate-name" data-de="Das Haus" data-en="About the Accommodation">Das Haus</span>
    </button>

    <button class="plate" onclick="showDetail('wifi')" style="--i:3">
      <span class="plate-bolt"></span>
      <svg class="plate-ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.6a10 10 0 0114 0"/><path d="M2 9a14.5 14.5 0 0120 0"/><path d="M8.4 16.1a5.5 5.5 0 017.2 0"/><circle cx="12" cy="19.6" r="1.1" fill="currentColor" stroke="none"/></svg>
      <span class="plate-name" data-de="WLAN / Internet" data-en="WiFi / Internet Details">WLAN / Internet</span>
    </button>

    <button class="plate" onclick="showDetail('checkout')" style="--i:4">
      <span class="plate-bolt"></span>
      <svg class="plate-ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h13v14H4z"/><path d="M8 10.5l2.6 2.6L15 8.2"/><path d="M20 9v6"/></svg>
      <span class="plate-name" data-de="Check-out Checkliste" data-en="Check-out Checklist">Check-out Checkliste</span>
    </button>

    <button class="plate plate--blaze" onclick="showDetail('contacts')" style="--i:5">
      <span class="plate-bolt"></span>
      <svg class="plate-ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M6.5 3.5h3l1.5 4-2 1.5a12 12 0 006 6l1.5-2 4 1.5v3a2 2 0 01-2.2 2A17.5 17.5 0 013.5 5.7a2 2 0 012-2.2z"/></svg>
      <span class="plate-name" data-de="Notfallnummern" data-en="Useful Contact Numbers">Notfallnummern</span>
    </button>

    <button class="plate" onclick="showDetail('farewell')" style="--i:6">
      <span class="plate-bolt"></span>
      <svg class="plate-ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20h16"/><path d="M6.5 20V4.8a.8.8 0 01.8-.8h9.4a.8.8 0 01.8.8V20"/><path d="M9.7 8.5v3.2M12 8.5v3.2M14.3 8.5v3.2"/></svg>
      <span class="plate-name" data-de="Auf Wiedersehen" data-en="So Long, Farewell!">Auf Wiedersehen</span>
    </button>

    <button class="plate plate--out" onclick="showDetail('localguide')" style="--i:7">
      <span class="plate-bolt"></span>
      <svg class="plate-ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 10c0 6-8 12-8 12S4 16 4 10a8 8 0 0116 0z"/><circle cx="12" cy="10" r="2.6"/></svg>
      <span class="plate-name" data-de="Ausflugstipps" data-en="Your Local Area Guide">Ausflugstipps</span>
      <span class="plate-dist" data-de="Im Tal" data-en="The valley">Im Tal</span>
    </button>
  </div>
</div>

<!-- ══════════ KARTE ══════════ -->
<div id="screen-map" class="screen">
  <div class="top-bar">
    <button class="icon-btn" onclick="showScreen('screen-home'); setNavActive('nav-home')" aria-label="Start">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 10.5 12 4l8 6.5V20a1 1 0 01-1 1h-4v-6h-6v6H5a1 1 0 01-1-1z"/></svg>
    </button>
    <span class="top-bar-title" data-de="Karte" data-en="Map">Karte</span>
    <span class="top-bar-spacer"></span>
  </div>
  <div id="map-container">
    <div id="google-map"></div>
    <button id="map-filter-bar" onclick="toggleMapFilter()" aria-expanded="false" aria-controls="map-filter-panel">
      <span class="plate-bolt"></span>
      <span data-de="Orte filtern" data-en="Tap to filter places">Orte filtern</span>
      <svg id="map-filter-arrow" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 15l6-6 6 6"/></svg>
    </button>
    <div id="map-filter-panel" class="hidden">
      <label class="filter-row"><input type="checkbox" class="map-cat" value="restaurant" checked onchange="updateMapMarkers()"><span class="tick" aria-hidden="true"></span><span data-de="Restaurants" data-en="Restaurants">Restaurants</span></label>
      <label class="filter-row"><input type="checkbox" class="map-cat" value="grocery" checked onchange="updateMapMarkers()"><span class="tick" aria-hidden="true"></span><span data-de="Einkaufen" data-en="Grocery Shopping">Einkaufen</span></label>
      <label class="filter-row"><input type="checkbox" class="map-cat" value="activity" checked onchange="updateMapMarkers()"><span class="tick" aria-hidden="true"></span><span data-de="Aktivitäten" data-en="Activities">Aktivitäten</span></label>
    </div>
  </div>
</div>

<!-- ══════════ SUCHE ══════════ -->
<div id="screen-search" class="screen">
  <div class="search-bar-wrap">
    <svg class="search-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
    <input type="text" id="search-input" class="search-input" oninput="doSearch()" data-placeholder-de="Suchen…" data-placeholder-en="Search…" placeholder="Suchen…" aria-label="Suchen" />
    <button class="icon-btn search-clear" onclick="clearSearch()" aria-label="Löschen">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
  </div>
  <div id="search-results"></div>
</div>

<!-- ══════════ DETAIL ══════════ -->
<div id="screen-detail" class="screen">
  <div class="top-bar">
    <button class="icon-btn" id="detail-back-btn" onclick="hideDetail()" aria-label="Zurück">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 19l-7-7 7-7"/></svg>
    </button>
    <span class="top-bar-title" id="detail-title"></span>
    <span class="top-bar-spacer"></span>
  </div>
  <div id="detail-content" class="detail-content"></div>
</div>

<!-- ══════════ NAV ══════════ -->
<nav class="bottom-nav" aria-label="Hauptnavigation">
  <button class="nav-btn active" id="nav-home" onclick="showScreen('screen-home'); setNavActive('nav-home')">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 10.5 12 4l8 6.5V20a1 1 0 01-1 1h-4v-6h-6v6H5a1 1 0 01-1-1z"/></svg>
    <span data-de="START" data-en="HOME">START</span>
  </button>
  <button class="nav-btn" id="nav-info" onclick="showScreen('screen-info'); setNavActive('nav-info')">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21V7"/><path d="M12 8h8v5h-8"/><path d="M12 15H5v-5h7"/></svg>
    <span data-de="WEGWEISER" data-en="SIGNPOST">WEGWEISER</span>
  </button>
  <button class="nav-btn" id="nav-map" onclick="showScreen('screen-map'); setNavActive('nav-map'); initMap()">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 4L3 6.5v13L9 17l6 3 6-2.5v-13L15 7z"/><path d="M9 4v13M15 7v13"/></svg>
    <span data-de="KARTE" data-en="MAP">KARTE</span>
  </button>
  <button class="nav-btn" id="nav-search" onclick="showScreen('screen-search'); setNavActive('nav-search')">
    <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
    <span data-de="SUCHE" data-en="SEARCH">SUCHE</span>
  </button>
</nav>

</div><!-- #app-shell -->
<script src="app.js?v=18"></script>
<script async defer src="https://maps.googleapis.com/maps/api/js?key=AIzaSyCQp4IVRPBNThAtWVxI6uOTgvkkWe3YmsM&callback=initGoogleMap"></script>
</body>
</html>
